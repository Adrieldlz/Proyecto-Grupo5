<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Spa Relax</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Spa Relax</h1>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="login.html" class="active">Iniciar Sesión</a>
      <a href="login_admin.html">Admin</a>
    </nav>
  </header>

  <div class="login-container">
    <h2>Bienvenido a Spa Relax</h2>
    <form id="loginForm" onsubmit="return validateLogin(event)">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
      </div>
      <div class="error-message" id="loginError" style="display: none; color: #ff6b6b; margin-bottom: 10px; text-align: center;"></div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
    
  <script src="script.js"></script>
    <div class="extra-links">
      <p>¿No tienes cuenta? <a href="registrarusuario.html">Regístrate</a></p>
      <p><a href="#">¿Olvidaste tu contraseña?</a></p>
    </div>
  </div>
</body>
</html>
